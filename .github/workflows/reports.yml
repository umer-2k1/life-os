name: reports

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "30 7 1 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and email reports
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/reports" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -H "content-type: application/json" \
            --max-time 55
